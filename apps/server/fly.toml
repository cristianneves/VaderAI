# Fly.io deployment for the VaderAI backend.
# Deploy from this directory: see docs/003-deployment.md for the full runbook.
#
# `app` must be globally unique on Fly — `fly launch` will rename it if taken.
app = "vaderai-server"

# Pick the region closest to the people using it: every answer crosses this hop
# twice and the latency budget is ~1.6 s end to end. gru = São Paulo.
# `fly platform regions` lists the rest.
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  SERVER_PORT = "8787"

[http_service]
  internal_port = 8787
  # Fly terminates TLS at the edge, so the desktop app gets wss:// on a real
  # certificate for *.fly.dev with nothing to configure. This is what closes the
  # "WSS with a real certificate" task.
  force_https = true

  # Deliberately NOT auto-stopping. Fly keeps a machine alive while connections
  # are open, so a session would not be cut off — but a cold start on the first
  # connect adds seconds to an app whose whole promise is a sub-2 s answer.
  # Flip auto_stop_machines to "suspend" and min_machines_running to 0 if you
  # would rather pay less than wait.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  # Sessions are long-lived WebSockets, so connections — not requests — are what
  # actually saturates an instance.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 150
    hard_limit = 200

  [[http_service.checks]]
    method = "GET"
    path = "/actuator/health"
    interval = "30s"
    timeout = "5s"
    # Spring Boot plus the JWKS fetch needs a moment before it answers.
    grace_period = "40s"
    # Health is DOWN when ANTHROPIC_API_KEY or DEEPGRAM_API_KEY is unset, so a
    # deploy with missing secrets fails here rather than at someone's first
    # question. `fly logs` names which one — see ProviderHealthIndicator.

[[vm]]
  size = "shared-cpu-1x"
  # 512 MB is too tight: Spring Boot plus PDFBox/POI plus a buffer per live
  # session will OOM under a couple of concurrent interviews.
  memory = "1gb"
