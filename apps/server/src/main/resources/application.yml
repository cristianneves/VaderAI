server:
  port: ${SERVER_PORT:8787}

spring:
  application:
    name: vaderai-server
  threads:
    # Java 21 virtual threads. This service is pure I/O fan-out — client WS,
    # Deepgram WS, Anthropic SSE — and the Anthropic SDK streams blocking.
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    ai.vader.server: DEBUG
