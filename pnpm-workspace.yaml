# apps/server is a Java/Maven project and is deliberately NOT a member here.
# Listing 'apps/*' would make pnpm try to manage it.
packages:
  - 'apps/desktop'
  - 'packages/*'

# pnpm 11 blocks postinstall scripts unless approved here. Electron needs its
# to download the runtime binary; esbuild needs its to fetch the platform
# binary. Without both, `electron-vite dev` cannot start.
allowBuilds:
  electron: true
  esbuild: true
  # Phase 8: electron-builder's helper binary is fetched by its postinstall.
  app-builder-bin: true
  # Pulled in by electron-builder but only used by the Squirrel.Windows target,
  # which we do not build — we ship NSIS and portable. Nothing needs its
  # postinstall, so it stays blocked.
  electron-winstaller: false
