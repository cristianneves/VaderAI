name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    env:
      # CI only typechecks and builds — it never launches Electron, so skip
      # the ~100 MB binary download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  java:
    name: Java
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Seven test classes run against the real Postgres, because the tables
      # hang off Supabase's auth schema and the cross-user scoping they prove is
      # what stands in for RLS — the backend connects as the service role and
      # bypasses it.
      #
      # They carry an assumeTrue guard meant to skip them when the stack is not
      # running, but it never fires: Spring Data JDBC resolves its dialect from
      # a live connection during context initialisation, so an unreachable
      # database fails the context before @BeforeEach runs. Without this step
      # those classes error rather than skip.
      #
      # The full stack, not a plain Postgres container: `auth.users` and the
      # foreign keys onto it are the point, and a bare image has neither. The
      # excluded services are the ones nothing here talks to.
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        working-directory: .
        run: supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit

      - run: ./mvnw -B verify
